<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Na istalu - Add Story</title>

    <link rel="stylesheet" href="admin.css">

</head>


<body>

    <div class="dashboard">

        <header class="dashboard-header">

            <div>

                <h1>Na istalu</h1>

                <p>Add New Story</p>

            </div>

            <a href="dashboard.html"
               class="back-btn">

                ← Dashboard

            </a>

        </header>


        <main class="dashboard-content">

            <div class="story-form-box">

                <h2>Publish a New Story</h2>

                <p class="form-description">

                    Add your story details below.

                </p>


                <form id="storyForm">


                    <!-- STORY TITLE -->

                    <label for="storyTitle">
                        Story Title
                    </label>

                    <input
                        type="text"
                        id="storyTitle"
                        placeholder="Enter story title"
                        required
                    >


                    <!-- AUTHOR -->

                    <label for="author">
                        Author
                    </label>

                    <input
                        type="text"
                        id="author"
                        placeholder="Enter author name"
                        required
                    >


                    <!-- CATEGORY -->

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="stories">
                            Stories
                        </option>

                        <option value="love-stories">
                            Love Stories
                        </option>

                        <option value="sunday-stories">
                            Sunday Stories
                        </option>

                    </select>


                    <!-- STORY IMAGE -->

                    <label for="storyImage">
                        Story Image
                    </label>

                    <input
                        type="file"
                        id="storyImage"
                        accept="image/*"
                    >

                    <p
                        id="uploadStatus"
                        class="form-description"
                    ></p>


                    <!-- STORY CONTENT -->

                    <label for="storyContent">
                        Story Content
                    </label>


                    <div class="editor-toolbar">

                        <button
                            type="button"
                            id="boldButton"
                        >
                            <b>B</b>
                        </button>

                    </div>


                    <textarea
                        id="storyContent"
                        rows="15"
                        placeholder="Write your story here..."
                        required
                    ></textarea>


                    <!-- PUBLISH -->

                    <button
                        type="submit"
                        class="publish-btn"
                        id="publishButton"
                    >

                        Publish Story

                    </button>


                </form>


                <p id="storyMessage"></p>


            </div>

        </main>

    </div>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyCtU4kBKmDWQWt72tJk96EKuLvH2MLq5JU",

            authDomain:
                "na-estalu.firebaseapp.com",

            projectId:
                "na-estalu",

            storageBucket:
                "na-estalu.firebasestorage.app",

            messagingSenderId:
                "790933220074",

            appId:
                "1:790933220074:web:6768a0a86547e786a78593",

            measurementId:
                "G-G94D1ZGPKK"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        const auth =
            getAuth(app);


        // =========================
        // AUTH CHECK
        // =========================

        onAuthStateChanged(
            auth,
            (user) => {

                if (!user) {

                    window.location.href =
                        "index.html";

                }

            }
        );


        // =========================
        // ELEMENTS
        // =========================

        const storyForm =
            document.getElementById(
                "storyForm"
            );


        const imageInput =
            document.getElementById(
                "storyImage"
            );


        const uploadStatus =
            document.getElementById(
                "uploadStatus"
            );


        const publishButton =
            document.getElementById(
                "publishButton"
            );


        const message =
            document.getElementById(
                "storyMessage"
            );


        // =========================
        // BOLD BUTTON
        // =========================

        document
            .getElementById("boldButton")
            .addEventListener(
                "click",
                function () {

                    const textarea =
                        document.getElementById(
                            "storyContent"
                        );


                    const start =
                        textarea.selectionStart;


                    const end =
                        textarea.selectionEnd;


                    if (start === end) {

                        return;

                    }


                    const selectedText =
                        textarea.value.substring(
                            start,
                            end
                        );


                    textarea.value =
                        textarea.value.substring(
                            0,
                            start
                        ) +

                        "<b>" +

                        selectedText +

                        "</b>" +

                        textarea.value.substring(
                            end
                        );

                }
            );


        // =========================
        // PUBLISH STORY
        // =========================

        storyForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const title =
                    document
                        .getElementById("storyTitle")
                        .value
                        .trim();


                const author =
                    document
                        .getElementById("author")
                        .value
                        .trim();


                const category =
                    document
                        .getElementById("category")
                        .value;


                const content =
                    document
                        .getElementById("storyContent")
                        .value
                        .trim();


                const imageFile =
                    imageInput.files[0];


                try {

                    publishButton.disabled =
                        true;


                    publishButton.textContent =
                        "Publishing...";


                    // =========================
                    // UPLOAD IMAGE
                    // =========================

                    let imageUrl = "";


                    if (imageFile) {

                        uploadStatus.textContent =
                            "Uploading image...";


                        const formData =
                            new FormData();


                        formData.append(
                            "file",
                            imageFile
                        );


                        formData.append(
                            "upload_preset",
                            "na_estalu_images"
                        );


                        formData.append(
                            "folder",
                            "na-estalu"
                        );


                        const response =
                            await fetch(
                                "https://api.cloudinary.com/v1_1/drkbvxed/image/upload",
                                {
                                    method: "POST",
                                    body: formData
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            console.error(
                                data
                            );

                            throw new Error(
                                "Image upload failed."
                            );

                        }


                        imageUrl =
                            data.secure_url;


                        uploadStatus.textContent =
                            "Image uploaded successfully ✓";

                    }


                    // =========================
                    // SAVE STORY
                    // =========================

                    await addDoc(
                        collection(
                            db,
                            "stories"
                        ),
                        {

                            title: title,

                            author: author,

                            category: category,

                            imageUrl: imageUrl,

                            content: content,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    message.style.color =
                        "green";


                    message.textContent =
                        "Story published successfully! 🎉";


                    storyForm.reset();


                    uploadStatus.textContent =
                        "";


                } catch (error) {

                    console.error(
                        "Publishing error:",
                        error
                    );


                    message.style.color =
                        "red";


                    message.textContent =
                        "Failed to publish story. Please try again.";

                }


                publishButton.disabled =
                    false;


                publishButton.textContent =
                    "Publish Story";

            }
        );

    </script>

</body>

</html>
