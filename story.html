<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Na istalu</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="stories.html">
                    Stories
                </a>
            </li>

            <li>
                <a href="love-stories.html">
                    Love Stories
                </a>
            </li>

            <li>
                <a href="about.html">
                    About
                </a>
            </li>

        </ul>

    </nav>


    <!-- STORY -->

    <article class="story-page">


        <p
            class="section-label"
            id="storyCategory"
        >
            STORY
        </p>


        <h1 id="storyTitle">
            Loading story...
        </h1>


        <p
            class="story-date"
            id="storyAuthor"
        >
            Loading...
        </p>


        <p
            class="story-date"
            id="storyDate"
        >
            Loading...
        </p>


        <!-- STORY IMAGE -->

        <img
            id="storyImage"
            alt="Story Image"
            style="
                display:none;
                max-width:100%;
                width:100%;
                margin:25px 0;
                border-radius:10px;
            "
        >


        <!-- STORY CONTENT -->

        <div
            class="story-content"
            id="storyContent"
        >

            <p>
                Loading story content...
            </p>

        </div>


        <!-- NAVIGATION -->

        <div class="chapter-navigation">

            <a href="stories.html">
                ← All Stories
            </a>

            <span>
                Na istalu
            </span>

            <a href="love-stories.html">
                More Stories →
            </a>

        </div>


    </article>


    <!-- FOOTER -->

    <footer class="footer">

        <h2>
            Na istalu
        </h2>

        <p>
            Stories that stay with you.
        </p>

        <p class="copyright">
            © 2026 Na istalu. All rights reserved.
        </p>

    </footer>


    <!-- FIREBASE -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


        import {
            getFirestore,
            doc,
            getDoc
        } from
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyCtU4kBKmDWQWt72tJk96EKuLvH2MLq5JU",

            authDomain:
                "na-estalu.firebaseapp.com",

            projectId:
                "na-estalu",

            storageBucket:
                "na-estalu.firebasestorage.app",

            messagingSenderId:
                "790933220074",

            appId:
                "1:790933220074:web:6768a0a86547e786a78593",

            measurementId:
                "G-G94D1ZGPKK"

        };


        const app =
            initializeApp(firebaseConfig);


        const db =
            getFirestore(app);


        // =========================
        // GET STORY ID
        // =========================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const storyId =
            urlParams.get("id");


        // =========================
        // ELEMENTS
        // =========================

        const titleElement =
            document.getElementById(
                "storyTitle"
            );


        const categoryElement =
            document.getElementById(
                "storyCategory"
            );


        const authorElement =
            document.getElementById(
                "storyAuthor"
            );


        const dateElement =
            document.getElementById(
                "storyDate"
            );


        const contentElement =
            document.getElementById(
                "storyContent"
            );


        const imageElement =
            document.getElementById(
                "storyImage"
            );


        // =========================
        // CLEAN STORY CONTENT
        // =========================

        function cleanStoryContent(content) {

            if (!content) {
                return "";
            }


            let cleaned = content;


            // Remove incorrect closing </br>

            cleaned =
                cleaned.replace(
                    /<\/br>/gi,
                    ""
                );


            // Remove encoded spaces

            cleaned =
                cleaned
                    .replace(
                        /&amp;nbsp;/gi,
                        " "
                    )
                    .replace(
                        /&nbsp;/gi,
                        " "
                    )
                    .replace(
                        /&#160;/gi,
                        " "
                    )
                    .replace(
                        /&#xA0;/gi,
                        " "
                    );


            // Remove actual non-breaking spaces

            cleaned =
                cleaned.replace(
                    /\u00A0/g,
                    " "
                );


            return cleaned;

        }


        // =========================
        // LOAD STORY
        // =========================

        async function loadStory() {

            if (!storyId) {

                titleElement.textContent =
                    "Story not found";

                authorElement.textContent =
                    "";

                dateElement.textContent =
                    "";

                contentElement.innerHTML =
                    "<p>No story was selected.</p>";

                return;

            }


            try {


                // =========================
                // GET STORY FROM FIREBASE
                // =========================

                const storyRef =
                    doc(
                        db,
                        "stories",
                        storyId
                    );


                const storySnapshot =
                    await getDoc(
                        storyRef
                    );


                // =========================
                // STORY NOT FOUND
                // =========================

                if (!storySnapshot.exists()) {

                    titleElement.textContent =
                        "Story not found";

                    authorElement.textContent =
                        "";

                    dateElement.textContent =
                        "";

                    contentElement.innerHTML =
                        "<p>This story could not be found.</p>";

                    return;

                }


                const story =
                    storySnapshot.data();


                // =========================
                // TITLE
                // =========================

                titleElement.textContent =
                    story.title ||
                    "Untitled Story";


                // =========================
                // CATEGORY
                // =========================

                let category =
                    story.category ||
                    "stories";


                if (
                    category ===
                    "love-stories"
                ) {

                    category =
                        "LOVE STORY";

                }

                else if (
                    category ===
                    "sunday-stories"
                ) {

                    category =
                        "SUNDAY STORY";

                }

                else {

                    category =
                        "STORY";

                }


                categoryElement.textContent =
                    category;


                // =========================
                // AUTHOR
                // =========================

                if (story.author) {

                    authorElement.textContent =
                        `Written by ${story.author}`;

                }

                else {

                    authorElement.textContent =
                        "Na istalu";

                }


                // =========================
                // DATE
                // =========================

                if (
                    story.createdAt &&
                    story.createdAt.toDate
                ) {

                    const date =
                        story.createdAt.toDate();


                    const formattedDate =
                        date.toLocaleDateString(
                            "en-IN",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        );


                    dateElement.textContent =
                        `Published on ${formattedDate}`;

                }

                else {

                    dateElement.textContent =
                        "";

                }


                // =========================
                // STORY IMAGE
                // =========================

                if (
                    story.imageUrl &&
                    story.imageUrl.trim() !== ""
                ) {

                    imageElement.src =
                        story.imageUrl;

                    imageElement.style.display =
                        "block";

                }

                else {

                    imageElement.style.display =
                        "none";

                }


                // =========================
                // STORY CONTENT
                // =========================

                const content =
                    cleanStoryContent(
                        story.content || ""
                    );


                // IMPORTANT:
                // Display the stored HTML directly.
                // This allows <br>, <b>, <i>, etc.
                // to render properly.

                contentElement.innerHTML =
                    content;


                // =========================
                // PAGE TITLE
                // =========================

                document.title =
                    `${story.title || "Story"} | Na istalu`;

            }


            catch (error) {

                console.error(
                    "Error loading story:",
                    error
                );


                titleElement.textContent =
                    "Unable to load story";


                authorElement.textContent =
                    "";


                dateElement.textContent =
                    "";


                contentElement.innerHTML =
                    `
                    <p>
                        Something went wrong while
                        loading this story.
                    </p>
                    `;

            }

        }


        // =========================
        // START
        // =========================

        loadStory();

    </script>


</body>

</html>
