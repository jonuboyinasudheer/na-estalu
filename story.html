<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Na Istalu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            Na Istalu
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="stories.html">Stories</a></li>
            <li><a href="love-stories.html">Love Stories</a></li>
            <li><a href="about.html">About</a></li>
        </ul>

    </nav>


    <!-- Story -->
    <article class="story-page">

        <p class="section-label" id="storyCategory">
            Na Istalu
        </p>

        <h1 id="storyTitle">
            Loading story...
        </h1>

        <p class="story-date" id="storyAuthor">
    Loading...
</p>

<p class="story-date" id="storyDate">
    Loading...
</p>

        <img
            id="storyImage"
            style="display: none; max-width: 100%; margin: 25px 0;"
            alt="Story Image"
        >

        <div class="story-content" id="storyContent">

            <p>Loading story content...</p>

        </div>


        <!-- Chapter Navigation -->

        <div class="chapter-navigation">

            <a href="stories.html">
                ← All Stories
            </a>

            <span>
                Na Istalu
            </span>

            <a href="love-stories.html">
                More Stories →
            </a>

        </div>

    </article>


    <!-- Footer -->

    <footer class="footer">

        <h2>Na Istalu</h2>

        <p>Stories that stay with you.</p>

        <p class="copyright">
            © 2026 Na Istalu. All rights reserved.
        </p>

    </footer>


    <!-- Firebase -->
    <script type="module">

        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        const firebaseConfig = {

            apiKey: "AIzaSyCtU4kBKmDWQWt72tJk96EKuLvH2MLq5JU",
            authDomain: "na-estalu.firebaseapp.com",
            projectId: "na-estalu",
            storageBucket: "na-estalu.firebasestorage.app",
            messagingSenderId: "790933220074",
            appId: "1:790933220074:web:6768a0a86547e786a78593",
            measurementId: "G-G94D1ZGPKK"

        };


        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        // Get story ID from URL

        const urlParams = new URLSearchParams(
            window.location.search
        );

        const storyId = urlParams.get("id");


        const titleElement =
            document.getElementById("storyTitle");

        const categoryElement =
            document.getElementById("storyCategory");

        const authorElement =
    document.getElementById("storyAuthor");

const dateElement =
    document.getElementById("storyDate");

const contentElement =
    document.getElementById("storyContent");

        const imageElement =
            document.getElementById("storyImage");


        async function loadStory() {

            if (!storyId) {

                titleElement.textContent =
                    "Story not found";

                authorElement.textContent = "";

                contentElement.innerHTML =
                    "<p>No story was selected.</p>";

                return;

            }


            try {

                const storyRef =
                    doc(db, "stories", storyId);

                const storySnapshot =
                    await getDoc(storyRef);


                if (!storySnapshot.exists()) {

                    titleElement.textContent =
                        "Story not found";

                    authorElement.textContent = "";

                    contentElement.innerHTML =
                        "<p>This story could not be found.</p>";

                    return;

                }


                const story =
                    storySnapshot.data();


                // Title

                titleElement.textContent =
                    story.title || "Untitled Story";


                // Category

                let categoryName = story.category || "story";

if (categoryName === "love-stories") {
    categoryName = "LOVE STORY";
} else if (categoryName === "sunday-stories") {
    categoryName = "SUNDAY STORY";
} else {
    categoryName = "STORY";
}

categoryElement.textContent = categoryName;


                // Author

                authorElement.textContent =
                    story.author
                        ? `Written by ${story.author}`
                        : "Na Istalu";
if (story.createdAt) {

    const date =
        story.createdAt.toDate();

    const formattedDate =
        date.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    dateElement.textContent =
        `Published on ${formattedDate}`;

} else {

    dateElement.textContent =
        "";

}

                // Image

                if (story.imageUrl) {

                    imageElement.src =
                        story.imageUrl;

                    imageElement.style.display =
                        "block";

                }


                // Content

                contentElement.innerHTML = "";


                const paragraphs =
                    (story.content || "").split(/\n+/);


                paragraphs.forEach(text => {

                    if (text.trim()) {

                        const paragraph =
                            document.createElement("p");

                        paragraph.textContent =
                            text.trim();

                        contentElement.appendChild(
                            paragraph
                        );

                    }

                });


                // Page title

                document.title =
                    `${story.title || "Story"} | Na Istalu`;


            } catch (error) {

                console.error(
                    "Error loading story:",
                    error
                );

                titleElement.textContent =
                    "Unable to load story";

                authorElement.textContent = "";

                contentElement.innerHTML =
                    "<p>Something went wrong while loading this story.</p>";

            }

        }


        loadStory();

    </script>

</body>

</html>
